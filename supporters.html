<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支援者さま一覧 - e Gacha Simulator</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    .supporters-container {
      max-width: 600px;
      margin: 30px auto;
      background: #1a1a1a;
      padding: 30px;
      border-radius: 20px;
      border: 2px solid #333;
      text-align: center;
    }
    h2 {
      color: #ffd700;
      font-size: 22px;
      margin-bottom: 20px;
    }
    p {
      color: #ddd;
      font-size: 14px;
      line-height: 1.6;
    }
    .supporters-list {
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin: 25px 0;
      text-align: left;
      min-height: 100px;
    }
    ul {
      padding-left: 20px;
      color: #ffd700;
      font-size: 16px;
      line-height: 2;
    }
    li {
      font-weight: bold;
    }
    .no-supporter {
      color: #888;
      text-align: center;
      font-weight: normal;
      list-style: none;
      padding: 20px 0;
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      color: #00aaff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="supporters-container">
  <h2>🌟 支援者さま一覧</h2>
  <p>
    1000円以上のご支援をいただき、お名前掲載をご希望いただいた温かい方々をご紹介させていただいております。<br>
    （順不同・敬称略）
  </p>

  <div class="supporters-list">
    <ul>
      <!-- 支援者が増えたらここに <li>お名前</li> を追加していきます -->
      <li class="no-supporter">まだ支援者さまはいません（一番乗りをお待ちしております…！）</li>
    </ul>
  </div>

  <p style="font-size: 12px; color: #aaa;">
    ご支援本当にありがとうございます！
  </p>

  <a href="index.html" class="back-btn">← ホームに戻る</a>
</div>

</body>
</html>
